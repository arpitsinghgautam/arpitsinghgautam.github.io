<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="newt and deuteron: a mini-Triton JIT compiler for LLM GPU kernels">
  <defs>
    <linearGradient id="newtbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcfcfe"/>
      <stop offset="1" stop-color="#eceff4"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#newtbg)"/>
  <rect width="640" height="6" fill="#2563eb"/>
  <text x="40" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="3" fill="#7a8190">NEWT &amp; DEUTERON</text>
  <text x="40" y="98" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#aab0bb">A Mini-Triton JIT Compiler for LLM GPU Kernels</text>

  <g font-family="'SF Mono', Consolas, monospace" font-size="15">
    <rect x="40" y="150" width="150" height="62" rx="9" fill="#222831"/>
    <text x="115" y="178" text-anchor="middle" fill="#ffffff" font-size="16">@newt.jit</text>
    <text x="115" y="198" text-anchor="middle" fill="#9aa0ab" font-size="12">block-level DSL</text>

    <rect x="245" y="150" width="150" height="62" rx="9" fill="#3b4252"/>
    <text x="320" y="178" text-anchor="middle" fill="#ffffff" font-size="16">NVRTC / PTX</text>
    <text x="320" y="198" text-anchor="middle" fill="#9aa0ab" font-size="12">thread layouts</text>

    <rect x="450" y="150" width="150" height="62" rx="9" fill="#2563eb"/>
    <text x="525" y="178" text-anchor="middle" fill="#ffffff" font-size="16">GPU</text>
    <text x="525" y="198" text-anchor="middle" fill="#cfe0ff" font-size="12">tensor cores</text>
  </g>
  <polygon points="222,181 200,171 200,191" fill="#c0392b"/>
  <polygon points="427,181 405,171 405,191" fill="#c0392b"/>

  <text x="320" y="256" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#6b7280">swizzled shared memory + software pipelining</text>

  <g font-family="-apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="700">
    <rect x="40" y="322" width="176" height="46" rx="9" fill="#222831"/>
    <text x="128" y="351" text-anchor="middle" fill="#ffffff">110 TFLOP/s FP16</text>
    <rect x="230" y="322" width="182" height="46" rx="9" fill="#c0392b"/>
    <text x="321" y="351" text-anchor="middle" fill="#ffffff">Triton bandwidth parity</text>
  </g>
  <text x="600" y="351" text-anchor="end" font-family="-apple-system, sans-serif" font-size="14" fill="#9aa0ab">Softmax · LayerNorm · matmul</text>
</svg>

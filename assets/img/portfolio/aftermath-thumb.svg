<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aftermath: ground-truth measurement of LLM deception in a multi-agent survival sandbox">
  <defs>
    <linearGradient id="aftbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcfcfe"/>
      <stop offset="1" stop-color="#eceff4"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#aftbg)"/>
  <rect width="640" height="6" fill="#7c3aed"/>
  <text x="40" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="3" fill="#7a8190">AFTERMATH</text>
  <text x="40" y="98" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#aab0bb">Ground-truth deception measurement in a multi-agent survival sandbox</text>

  <text x="40" y="150" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#9aa0ab">reported deception, before vs after prompt-disposition stripping</text>

  <rect x="40" y="168" width="420" height="42" rx="6" fill="#7c3aed"/>
  <text x="52" y="196" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff">with priming</text>
  <text x="472" y="196" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#7c3aed">100%</text>

  <rect x="40" y="222" width="63" height="42" rx="6" fill="#222831"/>
  <text x="115" y="250" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#6b7280">stripped</text>
  <text x="472" y="250" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#222831">15%</text>

  <text x="320" y="292" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#6b7280">causation-gating separates hoarding from real deception</text>

  <g font-family="-apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="700">
    <rect x="40" y="322" width="212" height="46" rx="9" fill="#7c3aed"/>
    <text x="146" y="351" text-anchor="middle" fill="#ffffff">85% deception collapse</text>
  </g>
  <text x="600" y="351" text-anchor="end" font-family="-apple-system, sans-serif" font-size="14" fill="#9aa0ab">measurement confounds in agentic evals</text>
</svg>

<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StreamServe: disaggregated LLM serving">
  <defs>
    <linearGradient id="ssbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcfcfe"/>
      <stop offset="1" stop-color="#eceff4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#ssbg)"/>
  <rect width="400" height="5" fill="#2563eb"/>
  <text x="200" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="2.5" fill="#7a8190">STREAMSERVE</text>

  <rect x="42" y="76" width="126" height="54" rx="8" fill="#222831"/>
  <text x="105" y="101" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">prefill</text>
  <text x="105" y="119" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" fill="#9aa0ab">compute bound</text>

  <rect x="232" y="76" width="126" height="54" rx="8" fill="#2563eb"/>
  <text x="295" y="101" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">decode</text>
  <text x="295" y="119" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" fill="#cfe0ff">memory bound</text>

  <line x1="176" y1="103" x2="216" y2="103" stroke="#c0392b" stroke-width="3" stroke-dasharray="5 4"/>
  <polygon points="228,103 210,94 210,112" fill="#c0392b"/>
  <text x="200" y="152" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#8a919c">disaggregated</text>

  <rect x="42" y="184" width="150" height="46" rx="8" fill="#222831"/>
  <text x="117" y="213" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">11-18× latency</text>
  <rect x="208" y="184" width="150" height="46" rx="8" fill="#c0392b"/>
  <text x="283" y="213" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">4.4× throughput</text>
  <text x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#8a919c">vs TP-vLLM on 4× A800 · arXiv:2604.09562</text>
</svg>
